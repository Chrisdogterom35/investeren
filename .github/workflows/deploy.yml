name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # ook handmatig te starten

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload bestanden
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
