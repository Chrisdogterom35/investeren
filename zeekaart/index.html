<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Zeekaart Gooimeer · Naarderbos · Muiden</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zeekaart" />
<meta name="theme-color" content="#0d9488" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Moderne nautische kaart voor Gooimeer, Naarderbos, Muiden en IJmeer." />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="map"></div>

<!-- ===== Search bar ===== -->
<div class="search-wrap">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Zoek haven, boei, locatie…" autocomplete="off" />
    <button class="search-clear" id="searchClear" aria-label="Wissen" style="display:none">×</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- ===== Right side controls ===== -->
<div class="fab-stack">
  <button class="fab" id="btnLayers" aria-label="Lagen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
  </button>
  <button class="fab" id="btnZoomIn" aria-label="Inzoomen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="fab" id="btnZoomOut" aria-label="Uitzoomen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="fab primary" id="btnLocate" aria-label="Mijn positie">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
  </button>
</div>

<!-- ===== Tools (left bottom floating) ===== -->
<div class="tools">
  <button class="tool" id="btnWaypoint" aria-label="Waypoint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z"/><circle cx="12" cy="9" r="3"/></svg>
  </button>
  <button class="tool" id="btnMeasure" aria-label="Meten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l18-18"/><path d="M5 17l2 2"/><path d="M9 13l2 2"/><path d="M13 9l2 2"/><path d="M17 5l2 2"/></svg>
  </button>
  <button class="tool" id="btnRoute" aria-label="Route">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 4-4V7"/></svg>
  </button>
  <button class="tool" id="btnTrack" aria-label="Track">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button class="tool" id="btnClear" aria-label="Wissen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
  </button>
</div>

<!-- ===== Layer drawer ===== -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Kaartlagen</h3>
    <button class="drawer-close" id="drawerClose" aria-label="Sluiten">×</button>
  </div>
  <div class="drawer-body">
    <div class="section-label">Basiskaart</div>
    <div class="base-grid">
      <button class="base-tile active" data-base="osm">
        <div class="base-thumb osm"></div><span>Standaard</span>
      </button>
      <button class="base-tile" data-base="sat">
        <div class="base-thumb sat"></div><span>Satelliet</span>
      </button>
      <button class="base-tile" data-base="topo">
        <div class="base-thumb topo"></div><span>Topo</span>
      </button>
      <button class="base-tile" data-base="dark">
        <div class="base-thumb dark"></div><span>Donker</span>
      </button>
    </div>

    <div class="section-label">Nautische lagen</div>
    <div class="toggle-list">
      <label class="toggle"><input type="checkbox" data-layer="seamark" checked /><span class="dot" style="background:#0d9488"></span>OpenSeaMap (boeien, lichten)</label>
      <label class="toggle"><input type="checkbox" data-layer="buoys" checked /><span class="dot" style="background:#dc2626"></span>Boeien & tonnen</label>
      <label class="toggle"><input type="checkbox" data-layer="fairways" checked /><span class="dot" style="background:#0ea5e9"></span>Vaargeulen</label>
      <label class="toggle"><input type="checkbox" data-layer="speed" checked /><span class="dot" style="background:#a855f7"></span>Snelvaargebieden</label>
      <label class="toggle"><input type="checkbox" data-layer="nature" checked /><span class="dot" style="background:#16a34a"></span>Natuurgebieden</label>
      <label class="toggle"><input type="checkbox" data-layer="swim" checked /><span class="dot" style="background:#0ea5e9"></span>Zwemzones</label>
      <label class="toggle"><input type="checkbox" data-layer="nogo" checked /><span class="dot" style="background:#ef4444"></span>Verboden zones</label>
    </div>

    <div class="section-label">Locaties</div>
    <div class="toggle-list">
      <label class="toggle"><input type="checkbox" data-cat="harbor" checked /><span class="emoji">⚓</span>Havens</label>
      <label class="toggle"><input type="checkbox" data-cat="anchor" checked /><span class="emoji">⚓</span>Ankerplaatsen</label>
      <label class="toggle"><input type="checkbox" data-cat="bridge" checked /><span class="emoji">🌉</span>Bruggen & sluizen</label>
      <label class="toggle"><input type="checkbox" data-cat="fuel" checked /><span class="emoji">⛽</span>Brandstof</label>
      <label class="toggle"><input type="checkbox" data-cat="beach" checked /><span class="emoji">🏖</span>Stranden</label>
      <label class="toggle"><input type="checkbox" data-cat="poi" checked /><span class="emoji">★</span>Bezienswaardig</label>
      <label class="toggle"><input type="checkbox" data-cat="danger" checked /><span class="emoji">⚠</span>Gevaar</label>
    </div>

    <div class="section-label">VHF-marifoonkanalen</div>
    <div class="vhf-list" id="vhfList"></div>

    <div class="disclaimer">
      ⓘ Alle data is indicatief en niet bedoeld voor primaire navigatie. Raadpleeg officiële kaarten van Vaarweginformatie.nl.
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<!-- ===== Bottom sheet (locations) ===== -->
<div class="sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Locaties in de buurt</h2>
    <button class="sheet-close" id="sheetClose" aria-label="Sluiten">×</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip active" data-filter="all">Alles</button>
    <button class="chip" data-filter="harbor">⚓ Havens</button>
    <button class="chip" data-filter="buoy">● Boeien</button>
    <button class="chip" data-filter="anchor">⚓ Anker</button>
    <button class="chip" data-filter="bridge">🌉 Bruggen</button>
    <button class="chip" data-filter="lock">🚪 Sluizen</button>
    <button class="chip" data-filter="fuel">⛽ Brandstof</button>
    <button class="chip" data-filter="beach">🏖 Strand</button>
    <button class="chip" data-filter="poi">★ Bezienswaardig</button>
    <button class="chip" data-filter="danger">⚠ Gevaar</button>
  </div>
  <div class="poi-list" id="poiList"></div>
</div>

<!-- ===== Info chip bar (bottom) ===== -->
<div class="infobar">
  <button class="infobar-btn" id="btnSheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Locaties
  </button>
  <div class="hud-mini">
    <div class="kv"><span class="k">SOG</span><span class="v" id="hudSpeed">--<i>kn</i></span></div>
    <div class="kv"><span class="k">COG</span><span class="v" id="hudHeading">--<i>°</i></span></div>
    <div class="kv"><span class="k">Z</span><span class="v" id="hudZoom">12</span></div>
  </div>
</div>

<!-- ===== Toast & measure pill ===== -->
<div class="toast" id="toast"></div>
<div class="measure-pill" id="measureInfo"></div>

<!-- ===== Legend ===== -->
<button class="legend-btn" id="legendBtn" aria-label="Legenda">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
</button>
<div class="legend" id="legend">
  <div class="legend-head">
    <span>Legenda</span>
    <button class="legend-close" id="legendClose">×</button>
  </div>
  <div class="legend-body" id="legendBody"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
