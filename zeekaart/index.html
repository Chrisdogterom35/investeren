<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Zeekaart Gooimeer · Naarderbos · Muiden</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zeekaart" />
<meta name="theme-color" content="#0a3d62" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Navionics-achtige zeekaart voor Gooimeer, Naarderbos, Muiden en IJmeer." />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="map"></div>

<div class="topbar">
  <div class="title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 18l9-15 9 15"/>
      <path d="M5 18a17 17 0 0 0 14 0"/>
      <path d="M12 3v15"/>
    </svg>
    <span>Zeekaart · Gooimeer</span>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnPoi" title="Locaties">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    Locaties
  </button>
</div>

<div class="compass" id="compass" title="Terug naar Gooimeer">
  <div class="compass-label">N</div>
  <div class="compass-arrow"></div>
</div>

<div class="controls-right">
  <button class="btn icon" id="btnZoomIn" aria-label="Inzoomen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="btn icon" id="btnZoomOut" aria-label="Uitzoomen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="btn icon" id="btnLayers" aria-label="Kaartlagen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
  </button>
  <button class="btn icon" id="btnLocate" aria-label="Mijn positie">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
  </button>
</div>

<div class="layer-menu" id="layerMenu">
  <div class="opt" data-base="osm">
    <input type="radio" name="base" id="base-osm" checked /> <label for="base-osm">Standaard kaart</label>
  </div>
  <div class="opt" data-base="sat">
    <input type="radio" name="base" id="base-sat" /> <label for="base-sat">Satelliet</label>
  </div>
  <div class="opt" data-base="topo">
    <input type="radio" name="base" id="base-topo" /> <label for="base-topo">Topografisch</label>
  </div>
  <div class="sep"></div>
  <div class="opt" data-toggle="seamark">
    <input type="checkbox" id="t-seamark" checked /> <label for="t-seamark">Zeekaart (boeien)</label>
  </div>
  <div class="opt" data-toggle="poi">
    <input type="checkbox" id="t-poi" checked /> <label for="t-poi">Havens & locaties</label>
  </div>
  <div class="opt" data-toggle="depth">
    <input type="checkbox" id="t-depth" /> <label for="t-depth">Diepte (indicatief)</label>
  </div>
</div>

<div class="measure-info" id="measureInfo">Tik op de kaart om te meten</div>
<div class="toast" id="toast">Welkom</div>

<div class="bottom">
  <div class="toolbar">
    <button class="btn" id="btnWaypoint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z"/><circle cx="12" cy="9" r="3"/></svg>
      Waypoint
    </button>
    <button class="btn" id="btnMeasure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l18-18"/><path d="M5 17l2 2"/><path d="M9 13l2 2"/><path d="M13 9l2 2"/><path d="M17 5l2 2"/></svg>
      Meten
    </button>
    <button class="btn" id="btnRoute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 4-4V7"/></svg>
      Route
    </button>
    <button class="btn" id="btnTrack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
      Track
    </button>
    <button class="btn" id="btnClear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      Wissen
    </button>
  </div>

  <div class="hud">
    <div class="cell">
      <div class="lbl">Snelheid</div>
      <div class="val" id="hudSpeed">--<span class="unit">kn</span></div>
    </div>
    <div class="cell">
      <div class="lbl">Koers</div>
      <div class="val" id="hudHeading">--<span class="unit">°</span></div>
    </div>
    <div class="cell">
      <div class="lbl">Positie</div>
      <div class="val pos" id="hudPos">--</div>
    </div>
    <div class="cell">
      <div class="lbl">Zoom</div>
      <div class="val" id="hudZoom">12</div>
    </div>
  </div>
</div>

<div class="sheet" id="poiSheet">
  <div class="handle"></div>
  <h2>Locaties in de buurt <button class="close" id="closePoi" aria-label="Sluiten">×</button></h2>
  <div class="poi-filter" id="poiFilter">
    <button class="chip active" data-filter="all">Alles</button>
    <button class="chip" data-filter="harbor">⚓ Havens</button>
    <button class="chip" data-filter="anchor">⚓ Anker</button>
    <button class="chip" data-filter="bridge">🌉 Bruggen</button>
    <button class="chip" data-filter="fuel">⛽ Diesel</button>
    <button class="chip" data-filter="beach">🏖 Strand</button>
    <button class="chip" data-filter="poi">★ Bezienswaardig</button>
    <button class="chip" data-filter="danger">! Gevaar</button>
  </div>
  <div class="poi-list" id="poiList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
