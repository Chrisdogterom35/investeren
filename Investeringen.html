<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ff-sans, 'Inter', system-ui, sans-serif);
    background: var(--bg, #f7f6f3);
    color: var(--fg, #111);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
    transition: background .3s ease, color .3s ease;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }

  /* ========== THEME: MINIMAL ========== */
  .theme-minimal {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #faf9f6;
    --border: #e8e5dd;
    --border-strong: #d4d0c4;
    --fg: #14130f;
    --fg-muted: #6b6860;
    --fg-dim: #a09c90;
    --accent: oklch(52% 0.13 260);
    --positive: oklch(55% 0.13 155);
    --negative: oklch(58% 0.18 25);
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Instrument Serif', 'Times New Roman', serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 1px 0 rgba(20,19,15,.04), 0 1px 2px rgba(20,19,15,.03);
  }

  /* ========== THEME: PREMIUM DARK ========== */
  .theme-dark {
    --bg: #0b0c0a;
    --surface: #141613;
    --surface-2: #1b1d19;
    --border: #262823;
    --border-strong: #353831;
    --fg: #f1efe7;
    --fg-muted: #9a978b;
    --fg-dim: #605e54;
    --accent: oklch(78% 0.14 85);
    --positive: oklch(72% 0.17 150);
    --negative: oklch(68% 0.20 28);
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Fraunces', 'Times New Roman', serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 12px;
    --radius-lg: 18px;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  }

  /* ========== THEME: WARM ========== */
  .theme-warm {
    --bg: #f1e9dc;
    --surface: #f8f2e6;
    --surface-2: #ebe1cf;
    --border: #d8ccb4;
    --border-strong: #b8a988;
    --fg: #2e241a;
    --fg-muted: #6f6250;
    --fg-dim: #a59780;
    --accent: oklch(48% 0.11 50);
    --positive: oklch(48% 0.10 145);
    --negative: oklch(52% 0.15 30);
    --ff-sans: 'Fraunces', Georgia, serif;
    --ff-display: 'Fraunces', Georgia, serif;
    --ff-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 6px;
    --radius-lg: 10px;
    --shadow: 0 1px 0 rgba(46,36,26,.04);
  }

  /* ========== THEME: BLOOMBERG ========== */
  .theme-terminal {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #111111;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --fg: #ffb000;
    --fg-muted: #c48b00;
    --fg-dim: #7a5600;
    --accent: #ff8a00;
    --positive: #00e676;
    --negative: #ff4040;
    --ff-sans: 'JetBrains Mono', ui-monospace, monospace;
    --ff-display: 'JetBrains Mono', ui-monospace, monospace;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 0px;
    --radius-lg: 0px;
    --shadow: none;
  }
  .theme-terminal body, .theme-terminal { letter-spacing: 0.01em; }

  /* ========== THEME: NORD ========== */
  .theme-nord {
    --bg: #2e3440;
    --surface: #3b4252;
    --surface-2: #434c5e;
    --border: rgba(76,86,106,0.9);
    --border-strong: #616e88;
    --fg: #eceff4;
    --fg-muted: #adb8cc;
    --fg-dim: #677080;
    --accent: #88c0d0;
    --positive: #a3be8c;
    --negative: #bf616a;
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Inter', system-ui, sans-serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  /* ========== THEME: SOLARIZED ========== */
  .theme-solarized {
    --bg: #fdf6e3;
    --surface: #eee8d5;
    --surface-2: #e5dfcc;
    --border: #cec8b4;
    --border-strong: #b5af9c;
    --fg: #586e75;
    --fg-muted: #839496;
    --fg-dim: #a0aaab;
    --accent: #268bd2;
    --positive: #859900;
    --negative: #dc322f;
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Fraunces', Georgia, serif;
    --ff-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --radius: 8px;
    --radius-lg: 14px;
    --shadow: 0 1px 0 rgba(88,110,117,.05), 0 2px 6px rgba(88,110,117,.07);
  }

  /* ========== THEME: NEBULA ========== */
  .theme-nebula {
    --bg: #0b0814;
    --surface: #140e22;
    --surface-2: #1c1530;
    --border: #291d40;
    --border-strong: #3d2b5e;
    --fg: #e8dff8;
    --fg-muted: #a08bbf;
    --fg-dim: #604d80;
    --accent: oklch(72% 0.22 310);
    --positive: oklch(72% 0.17 155);
    --negative: oklch(68% 0.22 28);
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Fraunces', 'Times New Roman', serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 14px;
    --radius-lg: 22px;
    --shadow: 0 4px 20px rgba(80,0,160,0.3), inset 0 0 0 1px rgba(160,100,255,0.06);
  }

  /* ========== THEME: CATPPUCCIN MOCHA ========== */
  .theme-catppuccin {
    --bg: #1e1e2e;
    --surface: #181825;
    --surface-2: #11111b;
    --border: #313244;
    --border-strong: #45475a;
    --fg: #cdd6f4;
    --fg-muted: #bac2de;
    --fg-dim: #6c7086;
    --accent: #89b4fa;
    --positive: #a6e3a1;
    --negative: #f38ba8;
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Fraunces', 'Times New Roman', serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 12px;
    --radius-lg: 18px;
    --shadow: 0 4px 20px rgba(0,0,0,0.45);
  }

  /* ========== THEME: GRUVBOX ========== */
  .theme-gruvbox {
    --bg: #282828;
    --surface: #32302f;
    --surface-2: #3c3836;
    --border: #504945;
    --border-strong: #665c54;
    --fg: #ebdbb2;
    --fg-muted: #d5c4a1;
    --fg-dim: #928374;
    --accent: #d79921;
    --positive: #98971a;
    --negative: #cc241d;
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Fraunces', Georgia, serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 4px;
    --radius-lg: 8px;
    --shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  /* ========== THEME: ROSE PINE ========== */
  .theme-rosepine {
    --bg: #191724;
    --surface: #1f1d2e;
    --surface-2: #26233a;
    --border: #403d52;
    --border-strong: #524f67;
    --fg: #e0def4;
    --fg-muted: #908caa;
    --fg-dim: #6e6a86;
    --accent: #c4a7e7;
    --positive: #9ccfd8;
    --negative: #eb6f92;
    --ff-sans: 'Inter', system-ui, sans-serif;
    --ff-display: 'Fraunces', Georgia, serif;
    --ff-mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 12px;
    --radius-lg: 20px;
    --shadow: 0 4px 20px rgba(25,23,36,0.6);
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  #root { min-height: 100vh; }

  .mono { font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }
  .serif { font-family: var(--ff-display); }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .dash-wrap { padding: 16px 14px 48px !important; }
    .widget-row { grid-template-columns: 1fr !important; }
    .hero-grid  { grid-template-columns: 1fr 1fr !important; gap: 16px !important; }
    .hero-grid > div:first-child { grid-column: 1 / -1; }
    .party-grid-inner { grid-template-columns: repeat(2, 1fr) !important; }
    .nav-inner { padding: 0 14px !important; }
    .nav-themes-row { display: none !important; }
    .nav-theme-label { display: none !important; }
    .nav-theme-select { display: inline-block !important; }
    .tweaks-panel { width: calc(100vw - 24px) !important; right: 12px !important; left: 12px !important; bottom: 12px !important; max-height: 85vh !important; }
    .spot-bar-source { display: none !important; }
  }
  @media (max-width: 420px) {
    .hero-grid { grid-template-columns: 1fr !important; }
    .party-grid-inner { grid-template-columns: 1fr !important; }
  }

  /* Theme select for mobile nav */
  .nav-theme-select {
    display: none;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 12px;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }
</style>
</head>
