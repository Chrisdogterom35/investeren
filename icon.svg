<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Achtergrond met afgeronde hoeken -->
  <rect width="512" height="512" rx="112" fill="#1a2744"/>
  <!-- Drie stijgende balken -->
  <rect x="72"  y="310" width="88" height="148" rx="10" fill="#ffffff" opacity="0.55"/>
  <rect x="200" y="230" width="88" height="228" rx="10" fill="#ffffff" opacity="0.75"/>
  <rect x="328" y="140" width="88" height="318" rx="10" fill="#ffffff" opacity="0.95"/>
  <!-- Stijgende lijn over de balken -->
  <polyline points="116,290 244,210 372,120"
