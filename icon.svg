<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#65a30d"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="arrowShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Witte achtergrond (iOS past zelf afgeronde hoeken toe) -->
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- Groene balken — oplopend -->
  <rect x="248" y="560" width="128" height="248" rx="64" fill="url(#bar1)"/>
  <rect x="416" y="468" width="128" height="340" rx="64" fill="url(#bar2)"/>
  <rect x="584" y="328" width="128" height="480" rx="64" fill="url(#bar3)"/>

  <!-- Witte stijgende pijl -->
  <g filter="url(#arrowShadow)">
    <path d="M210 640 L340 510 L430 570 L560 430 L650 490 L790 310"
      fill="none" stroke="#ffffff" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M738 292 L810 268 L786 340"
      fill="none" stroke="#ffffff" stroke-width="44"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
